name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: eshop
          POSTGRES_PASSWORD: eshop
          POSTGRES_DB: eshop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eshop -d eshop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://eshop:eshop@localhost:5432/eshop_test
      TEST_DATABASE_URL: postgresql://eshop:eshop@localhost:5432/eshop_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
